# GitHub Actions workflow: tests every change, and builds and publishes the container image.
# Note: inside the multi-line blocks below (lines after "|"), a # is NOT a YAML comment, so comments sit above them.
name: CI                                        # name shown on the repo's Actions page

on:                                             # events that start this workflow
  push:
    branches: [main]                            # commits pushed (or merged) to main
    tags: ['v*.*.*']                            # release tags like v0.2.1; * means "any text"
  pull_request:
    branches: [main]                            # pull requests into main (tests only, see "if" below)
  workflow_dispatch:                            # a "Run workflow" button on GitHub, to start it by hand

env:                                            # variables available to every job
  REGISTRY: ghcr.io                             # GitHub Container Registry
  IMAGE_NAME: ${{ github.repository }}          # owner/repo, i.e. ksycz/release-demo-app

jobs:
  test:                                         # job 1: run the tests
    runs-on: ubuntu-latest                      # on a fresh Linux machine from GitHub
    steps:
      - uses: actions/checkout@v4               # download the repo's code
      - uses: actions/setup-node@v4             # install Node.js …
        with:
          node-version: "24"                    # … version 24, the same as the Dockerfile's base image
      - run: npm test                           # run the "test" script from package.json

  build-and-push:                               # job 2: build the image and publish it
    needs: test                                 # only after the "test" job succeeded
    if: github.event_name != 'pull_request'     # not for pull requests: only main and release tags get images
    runs-on: ubuntu-latest
    permissions:                                # what this job's built-in GITHUB_TOKEN may do
      contents: read                            # read the code
      packages: write                           # publish images to ghcr.io
    steps:
      - uses: actions/checkout@v4               # download the repo's code

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}         # the user who started the run
          password: ${{ secrets.GITHUB_TOKEN }} # token GitHub creates for every run; no password stored

      # Works out the image tags. Push to main -> "main" and the short commit ID.
      # Tag v0.2.1 -> "0.2.1" (fixed, used by Kargo) and "0.2" (moves to the newest 0.2.x).
      - name: Docker metadata
        id: meta                                # name, so later steps can read its outputs
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Works out the version baked into the app (shown on / and /health).
      # Tag v0.2.1 -> "0.2.1" (${GITHUB_REF_NAME#v} cuts the leading v, so it matches the image tag).
      # Branch build -> "main-<full commit ID>".
      # The result is saved as an output called "value" by appending to the special file $GITHUB_OUTPUT.
      - name: Work out app version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      # Builds the image from the Dockerfile and pushes it with every tag from "Docker metadata".
      # APP_VERSION is passed to the Dockerfile's ARG.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .                            # build from the repo's top folder
          push: true                            # upload to the registry after building
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
              APP_VERSION=${{ steps.version.outputs.value }}
